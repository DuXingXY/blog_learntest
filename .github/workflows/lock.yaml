name: Lock inactive closed issues
# 锁定已关闭且两周内没有新活动的议题。
# 此流程不会关闭仍然开放的议题，关闭操作由维护者执行。
# 相比继续讨论旧议题，使用新的示例回应新议题更便于处理。

on:
  schedule:
    - cron: '0 0 * * *'
permissions: {}
concurrency:
  group: lock
  cancel-in-progress: true
jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      discussions: write
    steps:
      - uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6.0.2
        with:
          issue-inactive-days: 14
          pr-inactive-days: 14
          discussion-inactive-days: 14
